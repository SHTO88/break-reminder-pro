<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Available - Break Reminder Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 10px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Single scroll context — the whole page scrolls, no nested boxes */
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Thin custom scrollbar for the whole page */
    body::-webkit-scrollbar { width: 5px; }
    body::-webkit-scrollbar-track { background: var(--bg-primary); }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    body::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Header banner ── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 1.5rem 1.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-icon {
      font-size: 2rem;
      flex-shrink: 0;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .header-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-text .version-badge {
      display: inline-block;
      margin-top: 0.35rem;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    /* ── Meta row (date + current version) ── */
    .meta-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-row .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Release notes ── */
    .notes-section {
      padding: 1.25rem 1.5rem;
    }

    .notes-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    /* Rendered markdown styles */
    .notes-body {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.65;
    }

    .notes-body h1,
    .notes-body h2,
    .notes-body h3 {
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 600;
      margin: 1rem 0 0.4rem;
    }

    .notes-body h1:first-child,
    .notes-body h2:first-child,
    .notes-body h3:first-child {
      margin-top: 0;
    }

    .notes-body ul,
    .notes-body ol {
      padding-left: 1.25rem;
      margin: 0.4rem 0;
    }

    .notes-body li {
      margin: 0.2rem 0;
    }

    .notes-body p {
      margin: 0.4rem 0;
    }

    .notes-body code {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.4em;
      font-size: 0.82rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      color: #a5b4fc;
    }

    .notes-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .notes-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.75rem 0;
    }

    /* ── Action buttons ── */
    .actions {
      position: sticky;
      bottom: 0;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
      background: var(--bg-secondary);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99,102,241,0.45);
    }

    .btn-primary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🚀</div>
    <div class="header-text">
      <h1>Update Available</h1>
      <span class="version-badge" id="update-version">Loading…</span>
    </div>
  </div>

  <div class="meta-row">
    <span id="update-date">—</span>
    <span class="dot"></span>
    <span id="current-version">—</span>
  </div>

  <div class="notes-section">
    <div class="notes-title">What's new</div>
    <div class="notes-body" id="update-notes">Loading release notes…</div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="closeWindow()">Later</button>
    <button class="btn btn-primary" onclick="downloadUpdate()">⬇ Download Now</button>
  </div>

  <script type="module">
    import { WindowUtils } from './shared/window-utils.js';

    const { invoke } = window.__TAURI__.core;
    let downloadUrl_ref = '';

    // ── Minimal markdown → HTML renderer ─────────────────────────────────────
    // Handles the subset GitHub release notes typically use:
    // headings, bold, inline code, bullet/numbered lists, horizontal rules, paragraphs.
    function renderMarkdown(md) {
      if (!md) return '<em>No release notes provided.</em>';

      const escape = s => s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Process line by line for block-level elements
      const lines = md.split('\n');
      let html = '';
      let inList = false;
      let listTag = '';

      const closeList = () => {
        if (inList) { html += `</${listTag}>`; inList = false; listTag = ''; }
      };

      const inlineFormat = raw => {
        let s = escape(raw);
        // Bold: **text** or __text__
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
        // Italic: *text* only — skip _text_ variant to avoid mangling snake_case identifiers
        s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
        // Inline code: `text`
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        return s;
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        // Blank line
        if (trimmed === '') {
          closeList();
          continue;
        }

        // Horizontal rule
        if (/^[-*_]{3,}$/.test(trimmed)) {
          closeList();
          html += '<hr>';
          continue;
        }

        // Headings
        const hMatch = trimmed.match(/^(#{1,3})\s+(.+)/);
        if (hMatch) {
          closeList();
          const level = Math.min(hMatch[1].length, 3);
          html += `<h${level}>${inlineFormat(hMatch[2])}</h${level}>`;
          continue;
        }

        // Unordered list item
        const ulMatch = trimmed.match(/^[-*+]\s+(.+)/);
        if (ulMatch) {
          if (!inList || listTag !== 'ul') {
            closeList();
            html += '<ul>';
            inList = true;
            listTag = 'ul';
          }
          html += `<li>${inlineFormat(ulMatch[1])}</li>`;
          continue;
        }

        // Ordered list item
        const olMatch = trimmed.match(/^\d+\.\s+(.+)/);
        if (olMatch) {
          if (!inList || listTag !== 'ol') {
            closeList();
            html += '<ol>';
            inList = true;
            listTag = 'ol';
          }
          html += `<li>${inlineFormat(olMatch[1])}</li>`;
          continue;
        }

        // Regular paragraph
        closeList();
        html += `<p>${inlineFormat(trimmed)}</p>`;
      }

      closeList();
      return html || '<em>No release notes provided.</em>';
    }

    // ── Parse data and populate UI ────────────────────────────────────────────
    // Data is injected by Rust via window.eval() as window.__UPDATE_DATA__
    // after the page loads. We poll briefly to handle the race between page
    // DOMContentLoaded and the Rust injection (200ms after window creation).
    async function init() {
      // Wait up to 2s for Rust to inject __UPDATE_DATA__
      let data = null;
      for (let i = 0; i < 20; i++) {
        if (window.__UPDATE_DATA__) { data = window.__UPDATE_DATA__; break; }
        await new Promise(r => setTimeout(r, 100));
      }

      if (!data) {
        console.error('__UPDATE_DATA__ not received');
        document.getElementById('update-version').textContent = 'New Version';
        document.getElementById('update-notes').textContent = 'A new version is available.';
        document.getElementById('update-date').textContent = '';
        document.getElementById('current-version').textContent = '';
        return;
      }

      const { version, notes, downloadUrl, publishedAt } = data;
      downloadUrl_ref = downloadUrl;

      document.getElementById('update-version').textContent = version || 'New Version';
      document.getElementById('update-notes').innerHTML = renderMarkdown(notes || '');

      // Release date
      if (publishedAt) {
        try {
          const formatted = new Date(publishedAt).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          document.getElementById('update-date').textContent = `Released ${formatted}`;
        } catch {
          document.getElementById('update-date').textContent = 'Recently released';
        }
      } else {
        document.getElementById('update-date').textContent = 'Recently released';
      }

      // Current version for context
      try {
        const current = await invoke('get_app_version');
        document.getElementById('current-version').textContent = `You have v${current}`;
      } catch {
        document.getElementById('current-version').textContent = '';
      }
    }

    // ── Actions ───────────────────────────────────────────────────────────────
    async function downloadUpdate() {
      if (!downloadUrl_ref) {
        alert('Download URL not available. Please check the GitHub releases page manually.');
        return;
      }
      try {
        await invoke('open_url', { url: downloadUrl_ref });
        setTimeout(closeWindow, 800);
      } catch (err) {
        console.error('Error opening download URL:', err);
        alert('Failed to open download page. Please visit the GitHub releases page manually.');
      }
    }

    async function closeWindow() {
      await WindowUtils.closeWindow('update_notification');
    }

    window.downloadUpdate = downloadUpdate;
    window.closeWindow = closeWindow;

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeWindow(); }
      if (e.key === 'Enter')  { e.preventDefault(); downloadUpdate(); }
    });

    init();
  </script>
</body>
</html>
